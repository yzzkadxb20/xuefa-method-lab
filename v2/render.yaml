services:
  - type: web
    name: method-lab-v2
    runtime: node
    plan: free
    region: singapore
    rootDir: v2
    buildCommand: "npm install"
    startCommand: "node server-pg.mjs"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: methodlab-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: PGSSL
        value: "0"

databases:
  - name: methodlab-db
    plan: free
    region: singapore
