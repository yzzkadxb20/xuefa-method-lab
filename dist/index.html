<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10231e" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="copyright" content="© 2026 学法实验室 · 原创作品，未经许可不得复制或商用" />
  <title>学法实验室 · 把方法调试到适合你</title>
  <style>
:root {
  --ink: #10231e;
  --ink-2: #18342c;
  --ink-3: #24473c;
  --paper: #f3eee4;
  --paper-2: #faf6ee;
  --cream: #fffdf8;
  --white: #ffffff;
  --line: #ded6c7;
  --line-2: #ebe4d8;
  --muted: #6f756c;
  --muted-2: #92988f;
  --coral: #ff6b4a;
  --coral-dark: #d94e31;
  --coral-soft: #ffe8e1;
  --mint: #b9f2d0;
  --mint-2: #e7f9ee;
  --mint-3: #d2f5df;
  --gold: #f2c15b;
  --blue: #2e6f9e;
  --shadow-sm: 0 1px 2px rgba(16, 35, 30, 0.05), 0 4px 12px rgba(16, 35, 30, 0.04);
  --shadow-md: 0 12px 40px rgba(16, 35, 30, 0.10);
  --shadow-lg: 0 24px 80px rgba(16, 35, 30, 0.18);
  --radius: 18px;
  --font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  --serif: "Georgia", "Times New Roman", "Songti SC", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
::selection { background: var(--mint); color: var(--ink); }

.app {
  display: grid;
  grid-template-columns: 264px minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------------------------------------------------------------- sidebar */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 26px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  color: #f4f0e8;
  background:
    radial-gradient(420px 280px at 20% -10%, rgba(185, 242, 208, 0.18), transparent 65%),
    radial-gradient(340px 240px at 110% 60%, rgba(255, 107, 74, 0.12), transparent 65%),
    var(--ink);
  overflow: hidden;
}
.sidebar::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
  background-size: 18px 18px;
  mask-image: linear-gradient(to bottom, black, transparent 70%);
}
.brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.brand-mark {
  width: 44px; height: 44px; flex: 0 0 44px;
  display: grid; place-items: center;
  border-radius: 14px;
  color: var(--mint);
  background: rgba(185, 242, 208, 0.10);
  border: 1px solid rgba(185, 242, 208, 0.24);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
}
.brand-mark svg { width: 30px; height: 30px; }
.brand-name { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
.brand-sub { margin-top: 3px; font-family: var(--serif); font-size: 9px; letter-spacing: .24em; color: rgba(244,240,232,.48); }

.side-label {
  margin: 6px 6px -6px;
  font-size: 10px; letter-spacing: .18em;
  color: rgba(244,240,232,.38);
  position: relative; z-index: 1;
}
.nav { display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 1; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 11px 12px;
  color: rgba(244,240,232,.68);
  background: transparent; border: 0; border-radius: 12px;
  text-align: left; font-size: 13.5px; font-weight: 600;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; transform: translateX(2px); }
.nav-item.active {
  color: #fff;
  background: linear-gradient(90deg, rgba(185,242,208,.16), rgba(185,242,208,.06));
  box-shadow: inset 3px 0 0 var(--coral);
}
.nav-icon { width: 20px; text-align: center; font-size: 15px; filter: saturate(.85); }
.nav-badge, .nav-count {
  margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px;
  display: inline-grid; place-items: center;
  font-size: 10.5px; font-weight: 800; border-radius: 99px;
}
.nav-badge { color: var(--ink); background: var(--mint); }
.nav-count { color: rgba(244,240,232,.55); background: rgba(255,255,255,.07); }

.side-card {
  position: relative; z-index: 1;
  margin-top: 4px; padding: 15px;
  border: 1px solid rgba(185,242,208,.16);
  border-radius: 16px;
  background: rgba(185,242,208,.055);
}
.side-card-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--mint); }
.side-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 4px rgba(255,107,74,.12); }
.side-card p { margin: 8px 0 12px; font-size: 11.5px; line-height: 1.7; color: rgba(244,240,232,.62); }
.mini-progress { height: 5px; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; }
.mini-progress span { display: block; height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--coral)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.mini-label { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10px; color: rgba(244,240,232,.42); }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
.demo-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 11px 12px;
  color: var(--ink); background: var(--mint);
  border: 0; border-radius: 12px;
  font-size: 12.5px; font-weight: 800;
  transition: transform .18s ease, box-shadow .18s ease;
}
.demo-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(185,242,208,.18); }
.demo-arrow { margin-left: auto; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 10px 8px; border-top: 1px solid rgba(255,255,255,.08); }
.avatar-small { width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,107,74,.16); color: #ffd7cc; font-size: 13px; font-weight: 800; }
.user-meta { min-width: 0; }
.user-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-sub { margin-top: 2px; font-size: 10px; color: rgba(244,240,232,.42); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.streak { margin-left: auto; font-family: var(--serif); font-size: 19px; color: var(--mint); }
.streak span { margin-left: 1px; font-size: 9px; color: rgba(244,240,232,.42); }
.privacy { text-align: center; font-size: 9.5px; color: rgba(244,240,232,.30); }

/* ---------------------------------------------------------------- main / topbar */
.main { min-width: 0; height: 100vh; display: flex; flex-direction: column; background: var(--paper); overflow: hidden; }
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  padding: 22px 34px 18px;
  border-bottom: 1px solid rgba(16,35,30,.08);
  background: rgba(243,238,228,.86);
  backdrop-filter: blur(14px);
  z-index: 5;
}
.crumb { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-2); font-weight: 700; }
.topbar h1 { margin: 6px 0 0; font-size: 25px; line-height: 1.2; letter-spacing: -.02em; font-weight: 800; }
.topbar-right { display: flex; align-items: center; gap: 10px; padding-bottom: 2px; }
.date { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  color: var(--ink-2); background: var(--cream);
  border: 1px solid var(--line); border-radius: 99px;
  font-size: 10.5px; font-weight: 700;
}
.status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ea56b; box-shadow: 0 0 0 3px rgba(62,165,107,.12); }
.status-pill.off .dot { background: var(--muted-2); box-shadow: none; }
.status-pill.on { border-color: #c9ead6; background: #f2fcf6; color: #1e6b45; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--cream); color: var(--muted); font-size: 16px; }
.icon-btn:hover { color: var(--ink); border-color: #cfc6b5; }

/* ---------------------------------------------------------------- views */
.view { display: none; flex: 1 1 auto; min-height: 0; overflow: auto; }
.view.active { display: block; }
#view-chat.active { display: flex; overflow: hidden; }
.chat-shell { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 304px; min-height: 0; }
.chat-column { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.chat-stream {
  flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
  padding: 26px 34px 18px;
  background-image: radial-gradient(rgba(16,35,30,.055) 1px, transparent 1px);
  background-size: 22px 22px;
}
.chat-stream::-webkit-scrollbar, .context-column::-webkit-scrollbar, .view::-webkit-scrollbar { width: 8px; }
.chat-stream::-webkit-scrollbar-thumb, .context-column::-webkit-scrollbar-thumb, .view::-webkit-scrollbar-thumb { background: rgba(16,35,30,.14); border-radius: 99px; }

.message { display: flex; gap: 11px; margin: 0 0 20px; animation: rise .32s cubic-bezier(.2,.8,.2,1) both; }
.message.user { flex-direction: row-reverse; }
.avatar {
  width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center;
  border-radius: 11px; background: var(--ink); color: var(--mint);
  font-size: 13px; font-weight: 800; box-shadow: var(--shadow-sm);
}
.message.user .avatar { background: var(--coral); color: #fff; }
.msg-wrap { min-width: 0; flex: 1 1 auto; max-width: 820px; }
.message.user .msg-wrap { flex: 0 1 auto; max-width: 72%; }
.msg-meta { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 10px; color: var(--muted-2); }
.message.user .msg-meta { justify-content: flex-end; }
.msg-meta strong { color: var(--muted); font-weight: 700; }
.bubble {
  display: inline-block;
  max-width: 100%;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 4px 16px 16px 16px;
  background: var(--cream);
  box-shadow: var(--shadow-sm);
  font-size: 13.5px; line-height: 1.75;
  color: #26352f;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .bubble { border: 0; border-radius: 16px 4px 16px 16px; background: var(--coral); color: #fff; box-shadow: 0 8px 22px rgba(217,78,49,.18); }
.bubble p { margin: 0; }
.bubble .muted { color: var(--muted); }
.bubble strong { font-weight: 800; }
.bubble .hl { background: linear-gradient(transparent 55%, var(--mint) 55%); padding: 0 2px; }

/* cards inside chat */
.coach-card { margin-top: 2px; border-radius: 20px; border: 1px solid var(--line); background: var(--cream); box-shadow: var(--shadow-sm); overflow: hidden; }
.coach-card + .coach-card { margin-top: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px 0; }
.card-kicker { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--muted-2); }
.card-kicker .ico { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: var(--mint-2); font-size: 12px; }
.card-title { margin: 8px 18px 0; font-size: 18px; line-height: 1.35; font-weight: 800; letter-spacing: -.01em; }
.card-body { padding: 14px 18px 18px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-top: 1px dashed var(--line-2); background: #fcfaf4; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 99px; font-size: 10px; font-weight: 800; }
.tag.mint { color: #1e6b45; background: var(--mint-2); }
.tag.coral { color: #a53e27; background: var(--coral-soft); }
.tag.ink { color: var(--cream); background: var(--ink); }
.tag.gold { color: #7a5a10; background: #fff3d4; }
.tag.gray { color: var(--muted); background: #f1eee7; }

.diagnosis-card { border-left: 4px solid var(--coral); }
.diagnosis-grid { display: grid; grid-template-columns: 130px 1fr; gap: 18px; align-items: center; }
.readiness-ring {
  --value: 70;
  width: 118px; height: 118px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--coral) calc(var(--value) * 1%), #eee8dc 0);
  margin: 0 auto;
}
.readiness-ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--cream); }
.readiness-inner { position: relative; text-align: center; }
.readiness-num { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; }
.readiness-label { margin-top: 4px; font-size: 9px; color: var(--muted-2); letter-spacing: .08em; }
.diag-bullets { display: grid; gap: 9px; }
.diag-row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; font-size: 12px; line-height: 1.55; }
.diag-row .k { color: var(--muted-2); }
.diag-row .v { color: var(--ink-2); font-weight: 600; }
.prescription { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--mint-2); border: 1px solid #d2f0dd; font-size: 12px; line-height: 1.7; color: #245443; }

.method-card { border-color: #cbe9d5; background: linear-gradient(180deg, #f5fcf7 0%, #fffdf8 62%); }
.method-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.method-name { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.method-en { margin-top: 2px; font-family: var(--serif); font-size: 11px; letter-spacing: .08em; color: var(--muted-2); }
.fit-pill { flex: 0 0 auto; text-align: right; }
.fit-num { font-family: var(--serif); font-size: 26px; line-height: 1; color: #1e6b45; }
.fit-label { font-size: 9px; color: var(--muted-2); }
.method-quote { margin: 12px 0 0; font-size: 13px; line-height: 1.7; color: #3c4a43; }
.method-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.method-why { display: grid; gap: 7px; margin-top: 14px; }
.why-row { display: flex; gap: 8px; font-size: 12px; line-height: 1.6; color: #46554d; }
.why-row span:first-child { color: #2b8a5b; font-weight: 800; }
.reason-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.reason-pill { padding: 4px 8px; border-radius: 99px; background: rgba(16,35,30,.05); color: var(--muted); font-size: 10px; }
.evidence-badge { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--mint); font-size: 10px; font-weight: 800; }

.plan-card { border-color: #e4d8c2; }
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.plan-title { font-size: 18px; font-weight: 800; }
.plan-sub { margin-top: 4px; font-size: 11px; color: var(--muted); }
.plan-time { font-family: var(--serif); font-size: 23px; }
.plan-time span { font-family: var(--font); font-size: 9px; color: var(--muted-2); }
.task-list { display: grid; gap: 8px; margin-top: 14px; }
.task {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 11px 12px;
  border: 1px solid var(--line-2); border-radius: 12px;
  background: #fffefa;
  transition: background .18s ease, border-color .18s ease;
}
.task:hover { border-color: #d7cbb8; }
.task.done { background: #f1fbf5; border-color: #cdebd8; }
.task.done .task-title { text-decoration: line-through; color: var(--muted-2); }
.task-check {
  width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px;
  display: grid; place-items: center; border-radius: 6px;
  border: 1.5px solid #cdc5b7; background: #fff; color: transparent; font-size: 11px;
}
.task.done .task-check { border-color: #2b8a5b; background: #2b8a5b; color: #fff; }
.task-body { min-width: 0; flex: 1; }
.task-title { font-size: 12.5px; font-weight: 700; }
.task-desc { margin-top: 3px; font-size: 11px; line-height: 1.55; color: var(--muted); }
.task-meta { display: flex; gap: 8px; margin-top: 6px; font-size: 9.5px; color: var(--muted-2); }
.task-meta .out { color: #2b8a5b; font-weight: 700; }
.task-min { flex: 0 0 auto; font-size: 10px; color: var(--muted-2); margin-top: 2px; }
.plan-metric { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f7f3e9; font-size: 11px; line-height: 1.6; color: #5d5749; }
.plan-metric strong { color: var(--ink); }

.summary-card { border-left: 4px solid #2b8a5b; }
.summary-card.warn { border-left-color: var(--gold); }
.summary-card.bad { border-left-color: var(--coral); }
.summary-grid { display: grid; grid-template-columns: 110px 1fr; gap: 18px; align-items: center; }
.effect-ring {
  --value: 70;
  width: 104px; height: 104px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(#2b8a5b calc(var(--value) * 1%), #eee8dc 0);
  margin: 0 auto;
}
.effect-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--cream); }
.effect-inner { position: relative; text-align: center; }
.effect-num { font-family: var(--serif); font-size: 29px; line-height: 1; font-weight: 700; }
.effect-label { margin-top: 3px; font-size: 8.5px; color: var(--muted-2); letter-spacing: .08em; }
.summary-headline { font-size: 15px; font-weight: 800; line-height: 1.4; }
.summary-reason { margin-top: 6px; font-size: 11.5px; line-height: 1.7; color: var(--muted); }
.summary-stats { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.stat-pill { padding: 5px 8px; border-radius: 8px; background: #f6f2e9; font-size: 10px; color: var(--muted); }
.stat-pill b { color: var(--ink); }
.next-day { margin-top: 15px; padding: 13px 14px; border-radius: 13px; background: var(--ink); color: #edf7f0; }
.next-day-title { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--mint); }
.next-day ol { margin: 9px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.next-day li { font-size: 11.5px; line-height: 1.6; color: rgba(237,247,240,.82); }

.switch-card { border-color: #f2c9bd; background: linear-gradient(180deg, #fff4f0, #fffdf8); }
.switch-path { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.switch-old { padding: 7px 10px; border-radius: 9px; background: #f0ece3; color: var(--muted); font-size: 11px; text-decoration: line-through; }
.switch-arrow { color: var(--coral); font-weight: 800; }
.switch-new { padding: 7px 10px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; }
.switch-reason { margin-top: 10px; font-size: 11.5px; line-height: 1.7; color: #6b4438; }

/* gate card */
.gate-card { margin-top: 2px; border-radius: 22px; background: var(--ink); color: #f4f0e8; box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid rgba(185,242,208,.16); }
.gate-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
.gate-head .left { display: flex; align-items: center; gap: 9px; }
.gate-title { font-size: 16px; font-weight: 800; }
.gate-sub { font-size: 10px; color: rgba(244,240,232,.48); }
.gate-progress { display: flex; gap: 5px; margin: 14px 20px 0; }
.gate-seg { height: 4px; flex: 1; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.gate-seg i { display: block; height: 100%; width: 0; background: var(--mint); border-radius: inherit; transition: width .4s ease; }
.gate-seg.done i { width: 100%; }
.gate-seg.active i { width: 55%; background: var(--coral); }
.gate-questions { padding: 12px 20px 6px; display: grid; gap: 8px; }
.gate-q { display: flex; gap: 11px; padding: 11px 12px; border-radius: 13px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.035); }
.gate-q.active { border-color: rgba(255,107,74,.55); background: rgba(255,107,74,.08); }
.gate-q.done { border-color: rgba(185,242,208,.22); background: rgba(185,242,208,.055); }
.q-index { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; border-radius: 7px; background: rgba(255,255,255,.08); font-size: 10px; font-weight: 800; color: rgba(244,240,232,.62); }
.gate-q.active .q-index { background: var(--coral); color: #fff; }
.gate-q.done .q-index { background: var(--mint); color: var(--ink); }
.q-body { min-width: 0; }
.q-title { font-size: 11.5px; font-weight: 700; line-height: 1.5; color: rgba(244,240,232,.86); }
.q-hint { margin-top: 3px; font-size: 10px; line-height: 1.55; color: rgba(244,240,232,.40); }
.q-answer { margin-top: 4px; font-size: 11px; line-height: 1.55; color: var(--mint); }
.gate-lock { display: flex; align-items: center; gap: 7px; padding: 11px 20px 16px; font-size: 10px; color: rgba(244,240,232,.46); }
.gate-unlocked { display: flex; align-items: center; gap: 7px; padding: 11px 20px 16px; font-size: 11px; color: var(--mint); font-weight: 700; }

/* suggestions + composer */
.composer-wrap { flex: 0 0 auto; padding: 10px 34px 14px; background: linear-gradient(to top, var(--paper) 72%, rgba(243,238,228,0)); }
.suggestions { display: flex; gap: 7px; overflow-x: auto; padding: 0 0 9px; scrollbar-width: none; }
.suggestions::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; padding: 7px 10px;
  border: 1px solid #d8cfbf; border-radius: 99px;
  background: rgba(255,253,248,.8); color: #4f5b53;
  font-size: 10.5px; font-weight: 600;
  transition: all .16s ease;
}
.chip:hover { border-color: var(--coral); color: var(--coral-dark); background: #fff; transform: translateY(-1px); }
.composer {
  display: flex; align-items: flex-end; gap: 9px;
  padding: 8px 8px 8px 15px;
  border: 1px solid #d5cbbb; border-radius: 17px;
  background: var(--cream);
  box-shadow: 0 8px 30px rgba(16,35,30,.06);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.composer:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 4px rgba(16,35,30,.06), 0 10px 34px rgba(16,35,30,.08); }
.composer textarea { flex: 1; min-height: 24px; max-height: 130px; padding: 6px 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font-size: 13px; line-height: 1.6; }
.composer textarea::placeholder { color: #a7a196; }
.send-btn { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--ink); color: var(--mint); transition: transform .16s ease, background .16s ease; }
.send-btn:hover { transform: translateY(-1px); background: var(--ink-3); }
.send-btn:disabled { opacity: .4; cursor: default; transform: none; }
.send-btn svg { width: 18px; height: 18px; }
.composer-note { display: flex; justify-content: space-between; gap: 12px; padding: 7px 3px 0; font-size: 9.5px; color: #9c9588; }
.composer-note span:last-child { color: #a07a68; }

/* typing */
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted-2); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }

/* ---------------------------------------------------------------- context panel */
.context-column { border-left: 1px solid rgba(16,35,30,.08); background: rgba(250,246,238,.68); padding: 22px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.ctx-card { border: 1px solid var(--line); border-radius: 16px; background: var(--cream); padding: 14px; box-shadow: var(--shadow-sm); }
.ctx-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ctx-title { font-size: 10px; letter-spacing: .12em; font-weight: 800; color: var(--muted-2); }
.ctx-dots { display: flex; gap: 3px; }
.ctx-dots i { width: 6px; height: 6px; border-radius: 50%; background: #e3dccf; }
.ctx-dots i.on { background: var(--coral); }
.ctx-dots i.done { background: #2b8a5b; }
.ctx-gate-line { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; }
.ctx-gate-sub { margin-top: 5px; font-size: 10px; line-height: 1.55; color: var(--muted); }
.ctx-progress { height: 5px; margin-top: 9px; border-radius: 99px; background: #eee8dc; overflow: hidden; }
.ctx-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2b8a5b, var(--coral)); }
.ctx-today { margin-top: 2px; }
.ctx-method { font-size: 15px; font-weight: 800; line-height: 1.3; }
.ctx-method-sub { margin-top: 4px; font-size: 10px; color: var(--muted); }
.ctx-task-progress { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.ctx-task-progress .bar { flex: 1; height: 5px; border-radius: 99px; background: #eee8dc; overflow: hidden; }
.ctx-task-progress .bar span { display: block; height: 100%; background: #2b8a5b; border-radius: inherit; }
.ctx-task-progress .num { font-family: var(--serif); font-size: 13px; color: var(--muted); }
.ctx-btn { width: 100%; margin-top: 10px; padding: 9px 10px; border: 1px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--cream); font-size: 11px; font-weight: 800; }
.ctx-btn:hover { background: var(--ink-3); }
.ctx-memory-line { font-size: 12px; font-weight: 700; }
.ctx-memory-sub { margin-top: 5px; font-size: 10px; line-height: 1.6; color: var(--muted); }
.ctx-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 9px; padding: 0; border: 0; background: transparent; color: var(--coral-dark); font-size: 10px; font-weight: 700; }
.ctx-principles { background: var(--ink); color: #f4f0e8; border-color: var(--ink); }
.ctx-principles .ctx-title { color: var(--mint); }
.ctx-principles ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.ctx-principles li { display: flex; gap: 8px; font-size: 10.5px; line-height: 1.55; color: rgba(244,240,232,.66); }
.ctx-principles li span { color: var(--coral); font-weight: 800; }
.demo-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px dashed #d9c9a9; border-radius: 12px; background: #fff8e8; color: #7a5a10; font-size: 10.5px; }
.demo-banner button { border: 0; background: transparent; color: #a53e27; font-size: 10px; font-weight: 800; text-decoration: underline; }

/* ---------------------------------------------------------------- library */
#view-library, #view-memory, #view-report { padding: 28px 34px 50px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
.view-head h2 { margin: 5px 0 0; font-size: 25px; letter-spacing: -.02em; }
.view-head p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.kicker { font-family: var(--serif); font-size: 9px; letter-spacing: .2em; color: var(--coral-dark); }
.search-wrap { display: flex; align-items: center; gap: 8px; min-width: 250px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--cream); }
.search-wrap span { color: var(--muted-2); font-size: 17px; }
.search-wrap input { width: 100%; border: 0; outline: 0; background: transparent; font-size: 12px; }
.filter-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 18px; }
.filter-chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--cream); color: var(--muted); font-size: 10.5px; font-weight: 700; }
.filter-chip:hover { border-color: #c8bda9; color: var(--ink); }
.filter-chip.active { background: var(--ink); border-color: var(--ink); color: var(--mint); }
.method-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.method-tile { position: relative; padding: 15px 15px 13px; border: 1px solid var(--line); border-radius: 16px; background: var(--cream); box-shadow: var(--shadow-sm); text-align: left; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.method-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #cfc2ae; }
.method-tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.method-tile-name { font-size: 14px; font-weight: 800; }
.method-tile-en { margin-top: 2px; font-family: var(--serif); font-size: 9px; color: var(--muted-2); letter-spacing: .04em; }
.method-tile p { min-height: 36px; margin: 9px 0 10px; font-size: 10.5px; line-height: 1.6; color: var(--muted); }
.method-tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; border-top: 1px dashed var(--line-2); }
.domain-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--muted); }
.domain-dot i { width: 6px; height: 6px; border-radius: 50%; }
.method-tile-time { font-size: 9.5px; color: var(--muted-2); }
.evidence { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; background: var(--ink); color: var(--mint); font-size: 9px; font-weight: 800; }
.empty-state { grid-column: 1 / -1; padding: 60px 20px; border: 1px dashed #d7cbb8; border-radius: 18px; text-align: center; color: var(--muted); background: rgba(255,253,248,.5); }
.empty-state .big { font-size: 30px; margin-bottom: 10px; }

/* ---------------------------------------------------------------- memory / report */
.memory-top, .report-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
.memory-top h2, .report-top h2 { margin: 5px 0 0; font-size: 25px; letter-spacing: -.02em; }
.memory-top p, .report-top p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--cream); }
.stat-card .k { font-size: 9.5px; letter-spacing: .08em; color: var(--muted-2); font-weight: 700; }
.stat-card .v { margin-top: 6px; font-family: var(--serif); font-size: 26px; line-height: 1; }
.stat-card .v small { font-family: var(--font); font-size: 10px; color: var(--muted-2); }
.stat-card .s { margin-top: 5px; font-size: 9.5px; color: var(--muted); }
.memory-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; align-items: start; }
.panel { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--cream); box-shadow: var(--shadow-sm); }
.panel + .panel { margin-top: 14px; }
.panel-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
.panel-title h3 { margin: 0; font-size: 14px; }
.panel-title span { font-size: 9px; color: var(--muted-2); letter-spacing: .1em; }
.profile-line { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px dashed var(--line-2); }
.profile-line:first-of-type { border-top: 0; padding-top: 0; }
.profile-line .k { flex: 0 0 68px; font-size: 10px; color: var(--muted-2); padding-top: 2px; }
.profile-line .v { font-size: 11.5px; line-height: 1.65; color: var(--ink-2); font-weight: 600; }
.timeline { position: relative; padding-left: 17px; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 5px; bottom: 5px; width: 1px; background: #e1d8c8; }
.tl-item { position: relative; padding: 0 0 15px 9px; }
.tl-item::before { content: ""; position: absolute; left: -17px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--cream); border: 2px solid #b9b0a0; }
.tl-item.good::before { border-color: #2b8a5b; background: #2b8a5b; }
.tl-item.warn::before { border-color: var(--coral); background: var(--coral); }
.tl-date { font-size: 9px; color: var(--muted-2); letter-spacing: .04em; }
.tl-title { margin-top: 3px; font-size: 11.5px; font-weight: 700; line-height: 1.45; }
.tl-desc { margin-top: 3px; font-size: 10.5px; line-height: 1.6; color: var(--muted); }
.trial-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.trial-table th { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--line-2); color: var(--muted-2); font-weight: 700; font-size: 9px; letter-spacing: .06em; }
.trial-table td { padding: 8px 7px; border-bottom: 1px dashed var(--line-2); color: var(--ink-2); }
.trial-table tr:last-child td { border-bottom: 0; }
.badge-status { display: inline-flex; padding: 3px 6px; border-radius: 5px; font-size: 8.5px; font-weight: 800; }
.badge-status.active { color: #1e6b45; background: var(--mint-2); }
.badge-status.switched { color: #a53e27; background: var(--coral-soft); }
.memory-note { margin-top: 12px; padding: 11px 12px; border-radius: 11px; background: #f7f3e9; font-size: 10.5px; line-height: 1.65; color: #6a6253; }
.memory-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 11px; font-weight: 800; transition: all .16s ease; }
.btn:hover { border-color: #cfc2ae; transform: translateY(-1px); }
.btn.primary { border-color: var(--ink); background: var(--ink); color: var(--cream); }
.btn.primary:hover { background: var(--ink-3); }
.btn.coral { border-color: var(--coral); background: var(--coral); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.chart-box { padding: 6px 0 0; }
.chart { display: flex; align-items: flex-end; gap: 10px; height: 168px; padding: 12px 4px 0; border-bottom: 1px solid var(--line-2); }
.bar-group { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; height: 100%; position: relative; }
.bar-stack { width: 100%; max-width: 34px; height: 100%; display: flex; align-items: flex-end; gap: 3px; }
.bar { flex: 1; min-height: 2px; border-radius: 4px 4px 2px 2px; background: var(--ink); opacity: .86; transition: height .5s ease; }
.bar.effect { background: var(--coral); }
.bar-label { font-size: 8px; color: var(--muted-2); white-space: nowrap; }
.bar-values { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); display: none; padding: 5px 7px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 8.5px; white-space: nowrap; z-index: 2; }
.bar-group:hover .bar-values { display: block; }
.legend { display: flex; gap: 14px; padding-top: 9px; font-size: 9px; color: var(--muted); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }
.insight-list { display: grid; gap: 9px; }
.insight { display: flex; gap: 9px; padding: 10px 11px; border-radius: 11px; background: #f9f5ec; font-size: 10.5px; line-height: 1.65; color: #5e5749; }
.insight b { color: var(--ink); }
.insight .ico { flex: 0 0 auto; }
.report-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 14px; align-items: start; }
.report-note { margin-top: 12px; font-size: 9.5px; color: var(--muted-2); line-height: 1.6; }

/* ---------------------------------------------------------------- modal */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(16,35,30,.52); backdrop-filter: blur(6px); animation: fade .18s ease both; }
.modal { width: min(720px, 100%); max-height: min(88vh, 820px); overflow: auto; border-radius: 22px; background: var(--paper-2); box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.4); animation: pop .22s cubic-bezier(.2,.8,.2,1) both; }
.modal.narrow { width: min(520px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line-2); }
.modal-head h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.modal-head p { margin: 5px 0 0; font-size: 11px; color: var(--muted); }
.modal-close { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--cream); color: var(--muted); font-size: 14px; }
.modal-body { padding: 18px 22px 22px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 22px; border-top: 1px solid var(--line-2); background: #fcf8f0; }
.modal-close:hover { color: var(--ink); }

.feedback-grid { display: grid; gap: 16px; }
.feedback-block { padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--cream); }
.feedback-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 11.5px; font-weight: 800; }
.feedback-label small { font-weight: 400; color: var(--muted-2); font-size: 9.5px; }
.range-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--coral); }
.range-value { min-width: 42px; text-align: right; font-family: var(--serif); font-size: 20px; }
.mood-row { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
.mood-btn { flex: 1; min-width: 52px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: center; font-size: 18px; transition: all .15s ease; }
.mood-btn small { display: block; margin-top: 2px; font-size: 8px; color: var(--muted-2); }
.mood-btn.active { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 0 0 2px rgba(255,107,74,.12); }
.difficulty-row { display: flex; gap: 7px; margin-top: 10px; }
.diff-btn { flex: 1; padding: 8px 4px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 10px; color: var(--muted); }
.diff-btn.active { border-color: var(--ink); background: var(--ink); color: var(--mint); }
.feedback-note { width: 100%; min-height: 76px; margin-top: 9px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 11.5px; line-height: 1.6; resize: vertical; outline: 0; }
.feedback-note:focus { border-color: var(--ink-3); }
.feedback-tip { margin-top: 8px; padding: 9px 10px; border-radius: 9px; background: #f7f3e9; font-size: 9.5px; line-height: 1.6; color: #6f6758; }

.method-detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.method-detail-name { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
.method-detail-en { margin-top: 3px; font-family: var(--serif); font-size: 10px; color: var(--muted-2); letter-spacing: .06em; }
.detail-section { margin-top: 16px; }
.detail-section h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: .1em; color: var(--muted-2); }
.detail-section p, .detail-section li { font-size: 11.5px; line-height: 1.75; color: #3e4c45; }
.detail-section ul, .detail-section ol { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.detail-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-box { padding: 12px; border: 1px solid var(--line-2); border-radius: 11px; background: #fffdf8; }
.detail-box .t { font-size: 9px; letter-spacing: .08em; color: var(--muted-2); font-weight: 800; }
.detail-box .c { margin-top: 5px; font-size: 11px; line-height: 1.65; color: #4a564f; }
.source-note { margin-top: 14px; padding: 10px 12px; border-left: 2px solid var(--line); font-size: 9.5px; line-height: 1.6; color: var(--muted-2); }

.demo-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.demo-card { padding: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--cream); text-align: left; transition: all .16s ease; }
.demo-card:hover { border-color: var(--coral); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.demo-card .e { font-size: 22px; }
.demo-card .t { margin-top: 7px; font-size: 12px; font-weight: 800; }
.demo-card .s { margin-top: 4px; font-size: 10px; line-height: 1.55; color: var(--muted); }
.demo-card .go { margin-top: 9px; font-size: 9.5px; color: var(--coral-dark); font-weight: 800; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translate(-50%, 20px); max-width: min(90vw, 520px); padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--cream); font-size: 11.5px; line-height: 1.5; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all .22s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1180px) {
  .chat-shell { grid-template-columns: minmax(0, 1fr); }
  .context-column { display: none; }
}
@media (max-width: 980px) {
  .app { grid-template-columns: 226px minmax(0, 1fr); }
  .topbar { padding: 18px 22px 15px; }
  .chat-stream, .composer-wrap { padding-left: 22px; padding-right: 22px; }
  #view-library, #view-memory, #view-report { padding-left: 22px; padding-right: 22px; }
  .memory-grid, .report-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .app { display: block; }
  .sidebar { position: relative; width: 100%; height: auto; padding: 14px 14px 10px; gap: 10px; }
  .sidebar::after, .side-label, .side-card, .sidebar-foot .privacy, .user-chip { display: none; }
  .brand { margin-bottom: 4px; }
  .brand-mark { width: 36px; height: 36px; flex-basis: 36px; }
  .nav { flex-direction: row; gap: 4px; overflow-x: auto; }

everse","switch_when":"如果正确率低但时间够，先补基础；反之专门练速度。","source":"考试训练实践; 提取练习研究"},{"id":"error-autopsy","name":"错题尸检","en":"Error Autopsy","category":"考试策略","domains":["考试","专业课","编程/理工"],"goals":["考试","纠错"],"evidence":"B","evidence_note":"错误分类与重做是形成性评价中的常用高效做法。","time":30,"difficulty":2,"one_liner":"不只抄正确答案，要解剖「我为什么会错」。","why":"同一道题错三次，通常不是知识问题，而是错误类型没被看见。","steps":["抄题不抄答案","标注错误类型：知识/审题/计算/表达","写出正确思路和触发条件","3 天后重做"],"materials":["错题尸检表","错误类型标签","3 天后重做提醒卡"],"metric":"同类错误 7 天内不再犯","fail":["只抄答案","不分类","不复做"],"switch_to":"active-recall","switch_when":"如果错误类型分散，先用主动回忆做知识点诊断。","source":"Black & Wiliam (1998); 错题本实践"},{"id":"sleep-consolidation","name":"睡眠巩固","en":"Sleep Consolidation","category":"记忆巩固","domains":["通用","考试","时间管理"],"goals":["记忆","状态"],"evidence":"A","evidence_note":"睡眠对记忆巩固有稳定证据；不是熬夜的替代品。","time":30,"difficulty":1,"one_liner":"睡前只复习核心卡，睡够，早起先回忆。","why":"把复习塞进熬夜，通常是在用第二天的状态换今晚的安心。","steps":["睡前 30 分钟复习核心卡","不做新题","睡够 7 小时","早起先回忆昨晚内容"],"materials":["睡前核心卡","睡眠记录表","晨间回忆卡"],"metric":"晨间回忆正确率 ≥70%","fail":["熬夜补课","睡前刷手机","复习太满"],"switch_to":"spaced-repetition","switch_when":"如果睡眠不足，先修作息，不叠加新方法。","source":"Walker (2017); Diekelmann & Born (2010)"},{"id":"shadowing","name":"影子跟读","en":"Shadowing","category":"口语训练","domains":["英语口语","口头表达"],"goals":["口语","流利度","语音"],"evidence":"B","evidence_note":"二语口语训练中的常用方法，关键在于可理解输入加即时模仿。","time":25,"difficulty":2,"one_liner":"跟着真实语料同步说，练节奏、连读和语调。","why":"口语卡顿常常不是词汇不够，而是口腔没有形成节奏。","steps":["选 30-60 秒真实语料","盲听 1 遍抓大意","逐句跟读，模仿语音语调","录音对比，标 3 个卡点","脱稿复述"],"materials":["30-60 秒语料库","跟读打卡表","录音对比表","1 分钟复述卡"],"metric":"1 分钟录音中停顿 ≤5 次，3 个语块脱稿","fail":["只看字幕","跟读太快","不录音","选太难的材料"],"switch_to":"chunking","switch_when":"如果跟读流利但复述卡，说明输入没转成输出，改用语块串联加角色扮演。","source":"Cambridge English; 二语口语训练实践"},{"id":"self-talk","name":"自言自语独白","en":"Self-Talk","category":"口语训练","domains":["英语口语"],"goals":["口语","流利度"],"evidence":"C","evidence_note":"低门槛输出练习，适合降低开口焦虑；效果依赖持续反馈。","time":15,"difficulty":1,"one_liner":"用 3 句模板，把今天发生的事用英语说 60 秒。","why":   if (/写作|论文|作文|文案|essay|writing/.test(t)) return "写作";
  if (/审计|会计|法学|法律|医学|临床|金融|专业|期末|考研|考试|复习|备考|证书|cpa|acca/.test(t)) {
    return /期末|考研|考试|复习|备考|证书|cpa|acca/.test(t) ? "考试" : "专业课";
  }
  if (/时间|拖延|专注|坚持|计划|效率/.test(t)) return "时间管理";
  return "通用";
}

function parseMinutes(text) {
  const t = String(text || "");
  const min = t.match(/(\d+)\s*(分钟|min|mins|minutes)/i);
  if (min) return Math.max(5, parseInt(min[1], 10));
  const hour = t.match(/(\d+(?:\.\d+)?)\s*(小时|h|hr|hours?)/i);
  if (hour) return Math.max(5, Math.round(parseFloat(hour[1]) * 60));
  if (/半小时/.test(t)) return 30;
  if (/一小时|1\s*小时/.test(t)) return 60;
  return 30;
}

function parseDays(text) {
  const t = String(text || "");
  const week = t.match(/(\d+)\s*(周|星期|weeks?)/i);
  if (week) return parseInt(week[1], 10) * 7;
  const day = t.match(/(\d+)\s*(天|日|days?)/i);
  if (day) return parseInt(day[1], 10);
  const month = t.match(/(\d+)\s*(个月|月|months?)/i);
  if (month) return parseInt(month[1], 10) * 30;
  if (/明天|后天|下周/.test(t)) return 7;
  return 21;
}

function detectLevel(baseline) {
  const t = String(baseline || "");
  if (/零基础|没学过|小白|5\.0|5\.5|4\.5|不及格|60|很差|从零|不敢|开不了口/.test(t)) return "起步";
  if (/熟练|90|85|7\.5|8\.0|很好|流利|专业|资深/.test(t)) return "进阶";
  return "有基础";
}

function buildProfile(answers, name = "体验用户") {
  const [goal = "", baseline = "", constraints = ""] = answers;
  const domain = detectDomain(`${goal} ${baseline} ${constraints}`);
  return {
    name,
    goal: goal.trim(),
    baseline: baseline.trim(),
    constraints: constraints.trim(),
    domain,
    minutes: parseMinutes(`${constraints} ${goal}`),
    deadline: parseDays(`${goal} ${constraints}`),
    level: detectLevel(baseline),
    failedMethods: [],
    createdAt: new Date().toISOString(),
  };
}

function matchMethods(methods, profile) {
  const preferred = PREFERRED[profile.domain];
  const scored = methods.map((m) => {
    let score = 0;
    const reasons = [];
    if (m.domains.includes(profile.domain)) {
      score += 45;
      reasons.push(`领域匹配：${profile.domain}`);
    }
    if (m.domains.includes("通用")) score += 6;
    if (m.goals.some((g) => profile.goal.includes(g))) {
      score += 8;
      reasons.push("目标关键词吻合");
    }
    if (m.evidence === "A") score += 10;
    else if (m.evidence === "B") score += 6;
    else score += 2;
    if (m.time <= profile.minutes + 5) {
      score += 10;
      reasons.push(`时间成本 ${m.time} 分钟，适配你的 ${profile.minutes} 分钟`);
    } else if (m.time > profile.minutes * 2) {
      score -= 12;
      reasons.push(`时间成本 ${m.time} 分钟，超出你的预算`);
    }
    if (profile.level === "起步" && m.difficulty >= 4) score -= 10;
    if (profile.deadline <= 21 && ["past-paper-reverse", "timed-mock", "three-round-review"].includes(m.id)) {
      score += 12;
      reasons.push("临近截止，优先考试策略");
    }
    if (preferred === m.id) {
      score += 18;
      reasons.push("该场景的首选微试验");
    }
    if (profile.failedMethods?.includes(m.id)) {
      score -= 40;
      reasons.push("你之前试过且效果不佳");
    }
    return { ...m, fit: Math.max(0, Math.min(99, Math.round(score))), reasons };
  });
  scored.sort((a, b) => b.fit - a.fit || a.difficulty - b.difficulty);
  return scored.slice(0, 3);
}

function buildDiagnosis(profile, method) {
  const risk = (() => {
    const t = `${profile.baseline} ${profile.constraints}`;
    if (/没时间|忙|加班|课多|碎片|打断|宿舍/.test(t)) return "时间碎片化，计划容易被现实打断";
    if (/卡|不敢|紧张|忘|开不了口|语法|错/.test(t)) return "输出焦虑与提取困难，输入多但输出少";
    if (/拖延|坚持|三分钟热度|懒/.test(t)) return "启动阻力大于学习难度，需要先降低门槛";
    return "缺少可量化的反馈，难以判断方法是否真的有效";
  })();
  const readiness = Math.max(45, Math.min(92, 70 + (profile.deadline <= 21 ? 8 : 0) + (profile.minutes >= 30 ? 6 : -4)));
  return {
    title: "学情判断",
    headline: "你缺的不是更多方法，而是一个能验证效果的闭环。",
    summary: `目标「${profile.goal}」是具体的；你的起点是「${profile.baseline}」；每天可投入约 ${profile.minutes} 分钟，截止约 ${profile.deadline} 天。`,
    bullets: [
      { label: "目标清晰度", value: profile.goal.length > 12 ? "较高" : "一般，建议再具体一点" },
      { label: "当前起点", value: `${profile.level} · ${profile.domain}` },
      { label: "主要风险", value: risk },
      { label: "匹配准备度", value: `${readiness}/100` },
    ],
    prescription: `先用「${method.name}」做 3 天微试验。不要一次改所有习惯，只验证一件事：这个方法能不能让你今天产出可检查的结果。`,
    readiness,
  };
}

function buildTasks(profile, method) {
  const fn = TASK_TEMPLATES[profile.domain] || TASK_TEMPLATES["通用"];
  const override = TASK_OVERRIDES[method.id];
  const tasks = (override ? override() : fn(method)).map((t, i) => ({ ...t, id: `${method.id}-${i}`, done: false }));
  return {
    tasks,
    totalMinutes: tasks.reduce((s, t) => s + t.minutes, 0),
    success: method.metric,
    why: method.why,
  };
}

function buildNextDay(profile, method, decision) {
  if (decision.action === "switch") {
    return [
      "先用 5 分钟复述昨天最卡的 1 个点，不打开资料。",

      "结束前录/写 1 个可检查的输出，明天对比。",
    ];
  }

    "结束前做一次 2 分钟自测，记录分数和难度。",
  ];
}

function computeEffect({ completion, difficulty, score, mood }) {
  const moodScore = { 1: 40, 2: 55, 3: 65, 4: 80, 5: 95 }[mood] || 65;
  return Math.round(0.4 * completion + 0.3 * score + 0.2 * (100 - (difficulty - 1) * 20) + 0.1 * moodScore);
}

function decideOutcome({ completion, difficulty, score, effect }) {
  if (completion < 60) {
    return {
      action: "adjust",
      type: "执行阻力",
      headline: "先别换方法，先把门槛降下来。",
      reason: `完成率 ${completion}% 偏低，今天更像是被任务规模或环境打断了。先缩短单次时长、拆小任务，再判断方法本身。`,
    };
  }
  if (difficulty >= 5 && effect < 65) {
    return {
      action: "switch",
      type: "认知过载",
      headline: "这个方法对你现在太难了，换一个更可执行的。",
      reason: `难度 ${difficulty}/5 且效果分 ${effect}，继续硬扛只会消耗信心。换一个难度更低、反馈更快的方法。`,
    };
  }
  if (effect < 58 || score < 60) {
    return {
      action: "switch",
      type: "方法不匹配",
      headline: "你执行了，但效果没有跟上，建议换法。",
      reason: `效果分 ${effect}、自测 ${score}，说明「做了」但没有转化为可检查的结果。不是你不努力，是方法和当前瓶颈不匹配。`,
    };
  }
  return {
    action: "keep",
    type: "方法有效",
    headline: "今天这个方法值得保留，明天加一点难度。",
    reason: `效果分 ${effect}，完成率 ${completion}%，说明方法能被你执行并产生结果。明天只加一个变量：素材难度或自测严格度。`,
  };
}

    id: "makeup",
    label: "通勤妆 · 14 天",
    emoji: "💄",
    answers: [
      "2 周内学会一个 15 分钟通勤妆，日常上班能稳定画出来。",
      "会涂粉底和口红，但底妆容易卡粉，眼影总是画脏，分不清是产品还是手法问题。",
      "每天早上 20 分钟，自然光，在宿舍洗手台，只能半脸练习。",
    ],
    methodId: "half-face",
    switchId: "look-deconstruct",
    logs: [
      { completion: 75, difficulty: 3, score: 62, mood: 4, note: "半脸对比能看出卡粉位置。" },
      { completion: 80, difficulty: 3, score: 68, mood: 4, note: "换了上妆顺序，服帖一点。" },
      { completion: 70, difficulty: 4, score: 60, mood: 3, note: "眼影还是脏，可能是晕染问题。" },
      { completion: 85, difficulty: 3, score: 72, mood: 4, note: "按分区拆解后清楚多了。" },
      { completion: 90, difficulty: 3, score: 78, mood: 5, note: "15 分钟能完成，步骤没漏。" },
    ],
  },
};

const MOODS = [
  { value: 1, emoji: "😫", label: "很糟" },
  { value: 2, emoji: "😕", label: "有点卡" },
  { value: 3, emoji: "😐", label: "一般" },
  { value: 4, emoji: "🙂", label: "不错" },

];

function methodById(methods, id) {
  return methods.find((m) => m.id === id) || methods[0];
}

function scoreLabel(score) {
  if (score >= 80) return "高";

}

window.__ENGINE__ = { DOMAINS, DOMAIN_META, detectDomain, parseMinutes, parseDays, detectLevel, buildProfile, matchMethods, buildDiagnosis, buildTasks, buildNextDay, computeEffect, decideOutcome, SCENARIOS, MOODS, methodById, scoreLabel };

</script>
<script>
const E = window.__ENGINE__;
/* ------------------------------------------------------------------ utils */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const STORAGE_KEY = "methodlab.state.v3";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const esc = (s = "") =>
  String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escAttr = esc;
const uid = () => Math.random().toString(36).slice(2, 9);
const iso = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};
const dateLabel = (value) => {
  if (!value) return "";
  const d = new Date(String(value).slice(0, 10) + "T00:00:00");
  if (Number.isNaN(d.getTime())) return String(value);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
};
const timeLabel = (ts) =>
  new Date(ts || Date.now()).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
const avg = (arr) => (arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0);
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

function formatText(text = "") {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>")
    .replace(/\n/g, "<br>");
}

/* ------------------------------------------------------------------ state */
let METHODS = [];
let METHOD_MAP = new Map();
let state = null;
let feedbackDraft = null;
let busy = false;

function defaultState() {
  return {
    version: 3,
    createdAt: new Date().toISOString(),
    gate: { step: 0, answers: [], complete: false },
    profile: null,
    diagnosis: null,
    match: [],
    methodId: null,
    plan: null,
    logs: [],
    trials: [],
    messages: [],
    activeView: "chat",
    demo: null,
    lastSummary: null,
    llmAvailable: false,
    llmEnabled: false,
    llmModel: "",
    libraryFilter: "全部",
    librarySearch: "",
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.version !== 3) return null;
    return { ...defaultState(), ...parsed };
  } catch {
    return null;
  }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {
    /* local-first; ignore quota / private mode */
  }
}

/* ------------------------------------------------------------------ gate */
const GATE_QUESTIONS = [
  {
    title: "你想解决的具体学习目标是什么？",
    hint: "请给我一个场景 + 期限，例如「4 周后英文面试，能连续说 2 分钟」。",
    chips: ["4 周后英文面试，能连续说 2 分钟", "2 周后审计期末，想从 60 到 80", "7 天后课堂展示，想不紧张", "2 周学会 15 分钟通勤妆"],
  },
  {
    title: "你现在的真实起点如何？",
    hint: "给我一个最近的表现、分数、作品或卡点，不要只说「不太好」。",
    chips: ["雅思 5.5，开口就语法混乱", "模考 58，案例题丢分最多", "内容还行，上台语速就变快", "会基础，但底妆总卡粉"],
  },
  {
    title: "你每天能稳定投入多少时间？在什么环境？",
    hint: "时间、地点、干扰因素都算。越真实，任务卡越能执行。",
    chips: ["每天 30 分钟，晚上 9 点后，在宿舍", "每天 1 小时，晚上图书馆", "每天 20 分钟，午休空教室", "每天 20 分钟，早上自然光"],
  },
];

const PAGE_META = {
  chat: { crumb: "教练台 / 今日", title: "今天，先把方法调对。" },
  library: { crumb: "方法资产 / 方法库", title: "方法不是收藏，是拿来试的。" },
  memory: { crumb: "长期记忆 / 我的档案", title: "它记得你走过的弯路。" },
  report: { crumb: "反馈闭环 / 学习报告", title: "用反馈，而不是感觉，判断效果。" },
};

function addMessage(role, type, text = "", data = null) {
  const m = { id: uid(), role, type, text, data, ts: Date.now() };
  state.messages.push(m);
  return m;
}

function ensureGreeting() {
  if (state.messages.length) return;
  addMessage(
    "agent",
    "text",
    "嗨，我是小法 👋 学法实验室的学习教练。\n\n我会先问你 **3 个问题**，再给方案。不是走流程——没有起点和约束的推荐，都是耍流氓。\n\n你可以直接点下面的例子，也可以用自己的话回答。"
  );
  addMessage("agent", "gate");
}

/* ------------------------------------------------------------------ init */
async function init() {
  try {
    let data;
    if (window.__METHODS__) {
      data = window.__METHODS__;
    } else {
      const res = await fetch("data/methods.json", { cache: "no-store" });
      if (!res.ok) throw new Error("methods.json not found");
      data = await res.json();
    }
    METHODS = data.methods || [];
    METHOD_MAP = new Map(METHODS.map((m) => [m.id, m]));
    const navCount = $("#navMethods");
    if (navCount) navCount.textContent = String(METHODS.length);
  } catch (err) {
    $("#chatStream").innerHTML = `<div class="empty-state"><div class="big">⚠️</div><strong>方法库没有加载成功</strong><p>请用本地服务器打开页面：<code>npm start</code>，然后访问 http://localhost:4173。</p></div>`;
    return;
  }

  state = loadState();
  const params = new URLSearchParams(location.search);
  const demo = params.get("demo");

  if (demo === "gate") {
    state = defaultState();
    ensureGreeting();
  } else if (demo) {
    state = buildDemoState(params.get("scenario") || "english", demo);
  } else if (!state) {
    state = defaultState();
    ensureGreeting();
  }

  if (!state.messages?.length) ensureGreeting();
  bindEvents();
  renderAll();
  checkHealth();
  if (demo) persist();
}

/* ------------------------------------------------------------------ render */
function renderAll() {
  renderNav();
  renderSidebar();
  renderTopbar();
  renderChat();
  renderSuggestions();
  renderContext();
  if (state.activeView === "library") renderLibrary();
  if (state.activeView === "memory") renderMemory();
  if (state.activeView === "report") renderReport();
  persist();
}

function renderNav() {
  $$(".nav-item").forEach((btn) => btn.classList.toggle("active", btn.dataset.view === state.activeView));
  $$(".view").forEach((view) => view.classList.toggle("active", view.id === `view-${state.activeView}`));
  const meta = PAGE_META[state.activeView] || PAGE_META.chat;
  $("#crumb").textContent = meta.crumb;
  $("#pageTitle").textContent = meta.title;
  const todayCount = state.plan ? state.plan.tasks.filter((t) => !t.done).length : 1;
  const badge = $("#navToday");
  if (badge) badge.textContent = String(todayCount || "✓");
}

function renderSidebar() {
  const answered = state.gate.answers.filter(Boolean).length;
  const pct = state.gate.complete ? 100 : (answered / 3) * 100;
  const bar = $("#gateMiniBar");
  if (bar) bar.style.width = `${pct}%`;
  const txt = $("#gateMiniText");
  if (txt) txt.textContent = state.gate.complete ? "3 / 3 · 已解锁" : `${answered} / 3`;

  const name = state.profile?.name || "体验用户";
  $("#userName").textContent = name;
  $("#userAvatar").textContent = name.slice(0, 1);
  $("#userSub").textContent = state.profile
    ? `${state.profile.domain} · 第 ${state.logs.length + 1} 天`
    : "等待第一次诊断";
  $("#userStreak").innerHTML = `${computeStreak()}<span>d</span>`;
}

function renderTopbar() {
  const d = new Date();
  $("#todayLabel").textContent = `${d.getMonth() + 1}月${d.getDate()}日 · 周${"日一二三四五六"[d.getDay()]}`;
  const pill = $("#llmPill");
  const text = $("#llmText");
  if (!pill || !text) return;
  if (state.llmEnabled) {
    pill.classList.add("on");
    pill.classList.remove("off");
    text.textContent = state.llmModel || "AI 增强";
  } else {
    pill.classList.remove("on");
    pill.classList.add("off");
    text.textContent = "本地教练引擎";
  }
}

function renderChat() {
  const stream = $("#chatStream");
  if (!stream) return;
  const demo = state.demo
    ? `<div class="demo-banner"><span>✨ 演示档案：${esc(state.demo.label)} · 含模拟学习记录</span><button data-action="reset">退出演示</button></div>`
    : "";
  stream.innerHTML = demo + state.messages.map(renderMessage).join("");
  const focus = new URLSearchParams(location.search).get("focus");
  const target = focus ? stream.querySelector(`.${focus}-card`) : null;
  if (target) {
    setTimeout(() => target.scrollIntoView({ block: "center" }), 120);
  } else {
    scrollChat();
  }
}

function renderMessage(m) {
  const user = m.role === "user";
  const time = timeLabel(m.ts);
  let content = "";
  if (m.type === "text") content = `<div class="bubble">${formatText(m.text)}</div>`;
  else if (m.type === "gate") content = renderGateCard();
  else if (m.type === "diagnosis") content = renderDiagnosisCard(m.data?.diagnosis);
  else if (m.type === "method") content = renderMethodCard(m.data);
  else if (m.type === "plan") content = renderPlanCard(m.data);
  else if (m.type === "summary") content = renderSummaryCard(m.data);
  else if (m.type === "switch") content = renderSwitchCard(m.data);
  else content = `<div class="bubble">${formatText(m.text || "")}</div>`;

  return `
    <div class="message ${user ? "user" : "agent"}">
      <div class="avatar">${user ? "你" : "法"}</div>
      <div class="msg-wrap">
        <div class="msg-meta"><strong>${user ? "你" : "小法 · 学习教练"}</strong><span>${time}</span></div>
        ${content}
      </div>
    </div>`;
}

function renderGateCard() {
  const answers = state.gate.answers;
  const step = Math.min(state.gate.step, 3);
  const complete = state.gate.complete;
  const segs = [0, 1, 2].map((i) => {
    const done = complete || Boolean(answers[i]);
    const active = !complete && i === step;
    return `<div class="gate-seg ${done ? "done" : ""} ${active ? "active" : ""}"><i></i></div>`;
  }).join("");

  const questions = GATE_QUESTIONS.map((q, i) => {
    const done = Boolean(answers[i]);
    const active = !complete && i === step;
    return `
      <div class="gate-q ${done ? "done" : ""} ${active ? "active" : ""}">
        <div class="q-index">${done ? "✓" : i + 1}</div>
        <div class="q-body">
          <div class="q-title">${esc(q.title)}</div>
          ${done ? `<div class="q-answer">${esc(answers[i])}</div>` : `<div class="q-hint">${esc(q.hint)}</div>`}
        </div>
      </div>`;
  }).join("");

  return `
    <div class="gate-card">
      <div class="gate-head">
        <div class="left"><span class="tag coral">硬门槛</span><div><div class="gate-title">先回答 3 个问题</div><div class="gate-sub">答完之前，我不会给出最终方案</div></div></div>
        <span class="tag ink">${complete ? "已解锁" : `${answers.filter(Boolean).length} / 3`}</span>
      </div>
      <div class="gate-progress">${segs}</div>
      <div class="gate-questions">${questions}</div>
      ${complete
        ? `<div class="gate-unlocked">✅ 三问完成：学情判断 → 方法匹配 → 今日任务卡已解锁</div>`
        : `<div class="gate-lock">🔒 还差 ${3 - answers.filter(Boolean).length} 问；现在给方案，等于瞎猜。</div>`}
    </div>`;
}

function renderDiagnosisCard(d) {
  if (!d) return `<div class="coach-card"><div class="card-body">学情数据生成中…</div></div>`;
  return `
    <div class="coach-card diagnosis-card">
      <div class="card-head">
        <div class="card-kicker"><span class="ico">01</span> 学情判断</div>
        <span class="tag gray">不是标签，是起点</span>
      </div>
      <div class="card-title">${esc(d.headline)}</div>
      <div class="card-body">
        <div class="diagnosis-grid">
          <div class="readiness-ring" style="--value:${d.readiness}">
            <div class="readiness-inner"><div class="readiness-num">${d.readiness}</div><div class="readiness-label">准备度 / 100</div></div>
          </div>
          <div class="diag-bullets">
            ${d.bullets.map((b) => `<div class="diag-row"><div class="k">${esc(b.label)}</div><div class="v">${esc(b.value)}</div></div>`).join("")}
          </div>
        </div>
        <div class="prescription">${esc(d.prescription)}</div>
      </div>
      <div class="card-foot"><span class="muted">下一步：只选一个方法，先试 3 天。</span><span class="tag mint">可验证 · 可退出</span></div>
    </div>`;
}

function renderMethodCard(data) {
  if (!data?.method) return "";
  const m = data.method;
  const alts = (data.alternatives || []).filter((x) => x.id !== m.id).slice(0, 2);
  const reasons = (m.reasons || []).slice(0, 3);
  const dots = "●".repeat(m.difficulty) + "○".repeat(Math.max(0, 5 - m.difficulty));
  return `
    <div class="coach-card method-card">
      <div class="card-head">
        <div class="card-kicker"><span class="ico">02</span> 方法匹配</div>
        <span class="tag mint">3 天微试验</span>
      </div>
      <div class="card-body">
        <div class="method-top">
          <div><div class="method-name">${esc(m.name)}</div><div class="method-en">${esc(m.en)}</div></div>
          <div class="fit-pill"><div class="fit-num">${m.fit || "—"}</div><div class="fit-label">匹配度 / 100</div></div>
        </div>
        <div class="method-meta">
          <span class="tag mint"><span class="evidence-badge">${m.evidence}</span> 证据 ${m.evidence}</span>
          <span class="tag gray">${esc(m.category)}</span>
          <span class="tag gray">约 ${m.time} 分钟</span>
          <span class="tag gray">难度 ${dots}</span>
        </div>
        <p class="method-quote">${esc(m.one_liner)}</p>
        <div class="method-why">
          <div class="why-row"><span>为什么是它</span><span>${esc(m.why)}</span></div>
          <div class="why-row"><span>3 天后怎么判断</span><span>${esc(m.metric)}</span></div>
        </div>
        ${reasons.length ? `<div class="reason-list">${reasons.map((r) => `<span class="reason-pill">${esc(r)}</span>`).join("")}</div>` : ""}
        <div class="plan-metric"><strong>什么时候该换：</strong>${esc(m.switch_when)}</div>
        ${alts.length ? `
          <div class="detail-section" style="margin-top:14px">
            <h4>备选方案（不是备胎，是对照组）</h4>
            <div class="reason-list">
              ${alts.map((a) => `<button class="chip" data-action="open-method" data-id="${escAttr(a.id)}">${esc(a.name)} · ${a.fit || "—"} 分</button>`).join("")}
            </div>
          </div>` : ""}
      </div>
      <div class="card-foot"><span class="muted">方法来自方法库，不是现场编的。</span><span class="tag gold">证据 ${m.evidence}</span></div>
    </div>`;
}

function renderPlanCard(data) {
  if (!data?.plan) return "";
  const plan = data.plan;
  const method = data.method;
  const day = data.day || 1;
  const done = plan.tasks.filter((t) => t.done).length;
  const allDone = done === plan.tasks.length;
  return `
    <div class="coach-card plan-card">
      <div class="card-head">
        <div class="card-kicker"><span class="ico">03</span> 今日任务卡</div>
        <span class="tag gold">第 ${day} 天</span>
      </div>
      <div class="card-body">
        <div class="plan-top">
          <div><div class="plan-title">今天只做这 ${plan.tasks.length} 件事</div><div class="plan-sub">${esc(method.name)} · ${esc(method.category)}</div></div>
          <div class="plan-time">${plan.totalMinutes}<span>min</span></div>
        </div>
        <div class="task-list">
          ${plan.tasks.map((t) => `
            <div class="task ${t.done ? "done" : ""}">
              <button class="task-check" data-action="toggle-task" data-task="${escAttr(t.id)}" aria-label="标记完成">✓</button>
              <div class="task-body">
                <div class="task-title">${esc(t.title)}</div>
                <div class="task-desc">${esc(t.desc)}</div>
                <div class="task-meta"><span>产出：<span class="out">${esc(t.output)}</span></span><span>·</span><span>可检查</span></div>
              </div>
              <div class="task-min">${t.minutes}′</div>
            </div>`).join("")}
        </div>
        <div class="plan-metric"><strong>完成标准：</strong>${esc(plan.success)}<br><strong>今天只改一个变量：</strong>先按卡执行，不临时加码。</div>
      </div>
      <div class="card-foot">
        <span class="muted">已完成 ${done}/${plan.tasks.length} · 完成后请反馈</span>
        <button class="btn ${allDone ? "coral" : "primary"}" data-action="open-feedback">${allDone ? "全部完成，去打卡 ✅" : "完成打卡，反馈今天"}</button>
      </div>
    </div>`;
}

function renderSummaryCard(data) {
  if (!data?.log) return "";
  const { log, decision, method, nextDay, nextMethod } = data;
  const color = log.effect >= 70 ? "#2b8a5b" : log.effect >= 55 ? "#c6922e" : "#ff6b4a";
  const cls = log.effect >= 70 ? "" : log.effect >= 55 ? "warn" : "bad";
  return `
    <div class="coach-card summary-card ${cls}">
      <div class="card-head">
        <div class="card-kicker"><span class="ico">04</span> 今日总结</div>
        <span class="tag ${decision.action === "keep" ? "mint" : decision.action === "switch" ? "coral" : "gold"}">${esc(decision.type)}</span>
      </div>
      <div class="card-body">
        <div class="summary-grid">
          <div class="effect-ring" style="background:conic-gradient(${color} calc(${log.effect} * 1%), #eee8dc 0)">
            <div class="effect-inner"><div class="effect-num">${log.effect}</div><div class="effect-label">今日效果分</div></div>
          </div>
          <div>
            <div class="summary-headline">${esc(decision.headline)}</div>
            <div class="summary-reason">${esc(decision.reason)}</div>
            <div class="summary-stats">
              <span class="stat-pill">完成率 <b>${log.completion}%</b></span>
              <span class="stat-pill">难度 <b>${log.difficulty}/5</b></span>
              <span class="stat-pill">自测 <b>${log.score}</b></span>
              <span class="stat-pill">投入 <b>${log.minutes || method.time} 分钟</b></span>
            </div>
          </div>
        </div>
        ${log.note ? `<div class="memory-note">📝 你的原话：${esc(log.note)}</div>` : ""}
        <div class="next-day">
          <div class="next-day-title">🌤 明天学什么（已排好）</div>
          <ol>${(nextDay || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
        </div>
      </div>
      <div class="card-foot">
        <span class="muted">${nextMethod ? "已触发换法，下面看新任务卡。" : "保持方法，明天只加一个变量。"}</span>
        <button class="btn ghost" data-action="view" data-view="report">看趋势 →</button>
      </div>
    </div>`;
}

function renderSwitchCard(data) {
  if (!data?.from || !data?.to) return "";
  return `
    <div class="coach-card switch-card">
      <div class="card-head">
        <div class="card-kicker"><span class="ico">↺</span> 换法建议</div>
        <span class="tag coral">不是失败，是调试</span>
      </div>
      <div class="card-body">
        <div class="switch-path">
          <span class="switch-old">${esc(data.from.name)}</span>
          <span class="switch-arrow">→</span>
          <span class="switch-new">${esc(data.to.name)}</span>
        </div>
        <div class="switch-reason">${esc(data.decision?.reason || "你主动选择了新的方法。先试 3 天，用反馈决定去留。")}</div>
        <div class="plan-metric"><strong>新方法的判断标准：</strong>${esc(data.to.metric)}</div>
      </div>
      <div class="card-foot"><span class="muted">旧方法不是没用，只是不适合现在的你。</span><span class="tag gray">${esc(data.to.category)}</span></div>
    </div>`;
}

/* ------------------------------------------------------------------ context */
function renderContext() {
  const panel = $("#contextPanel");
  if (!panel) return;
  const answered = state.gate.answers.filter(Boolean).length;
  const pct = state.gate.complete ? 100 : (answered / 3) * 100;

  const done = tasks.filter((t) => t.done).length;
  const lastLog = state.logs[state.logs.length - 1];
  const method = state.methodId ? METHOD_MAP.get(state.methodId) : null;

  panel.innerHTML = `
    ${state.demo ? `<div class="demo-banner"><span>✨ ${esc(state.demo.label)}</span><button data-action="reset">退出</button></div>` : ""}
    <div class="ctx-card">
      <div class="ctx-head"><div class="ctx-title">三问门槛</div><div class="ctx-dots">${[0, 1, 2].map((i) => `<i class="${state.gate.complete || state.gate.answers[i] ? "done" : i === state.gate.step ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="ctx-gate-line"><span>${state.gate.complete ? "已解锁方案" : `还差 ${3 - answered} 问`}</span><span>${answered}/3</span></div>
      <div class="ctx-gate-sub">${state.gate.complete ? "三问已进入记忆，后续不再重复问。" : "未答完前，只澄清问题，不给最终方案。"}</div>
      <div class="ctx-progress"><span style="width:${pct}%"></span></div>
    </div>
    <div class="ctx-card">
      <div class="ctx-head"><div class="ctx-title">今天</div><span class="tag ${state.plan ? "mint" : "gray"}">${state.plan ? `第 ${state.logs.length + 1} 天` : "未开始"}</span></div>
      ${state.plan ? `
        <div class="ctx-method">${esc(method?.name || "今日方法")}</div>
        <div class="ctx-method-sub">${done}/${tasks.length} 个任务 · 约 ${state.plan.totalMinutes} 分钟</div>
        <div class="ctx-task-progress"><div class="bar"><span style="width:${tasks.length ? (done / tasks.length) * 100 : 0}%"></span></div><div class="num">${done}/${tasks.length}</div></div>
        <button class="ctx-btn" data-action="open-feedback">完成打卡 →</button>
      ` : `
        <div class="ctx-gate-sub">完成三问后，这里会出现一张今天能执行、晚上能验收的任务卡。</div>
        <button class="ctx-btn" data-action="focus-input">去回答第 ${Math.min(answered + 1, 3)} 问 →</button>
      `}
    </div>

      <div class="ctx-head"><div class="ctx-title">它记得你</div><span class="tag gray">${state.logs.length} 次反馈</span></div>
      <div class="ctx-memory-line">${lastLog ? `最近一次：${lastLog.effect} 分` : "还没有学习记忆"}</div>
      <div class="ctx-memory-sub">${lastLog ? `第 ${lastLog.day} 天 · ${esc(lastLog.methodName)}<br>${esc(lastLog.note || "已记录完成率、难度、自测和状态。")}` : "完成第一次打卡后，它会开始记录什么有效、什么无效。"}</div>
      <button class="ctx-link" data-action="view" data-view="memory">查看记忆时间线 →</button>
    </div>

      <div class="ctx-title">教练原则</div>
      <ul>
        <li><span>01</span> 不替你做决定，只帮你看清代价。</li>
        <li><span>02</span> 每次只改一个变量。</li>
        <li><span>03</span> 效果不好就换法，不硬扛。</li>

}

function renderSuggestions() {
  const box = $("#suggestions");
  if (!box) return;
  let chips = [];
  if (!state.gate.complete) {
    const q = GATE_QUESTIONS[state.gate.step] || GATE_QUESTIONS[0];
    chips = q.chips;
  } else if (!state.plan) {
    chips = ["帮我生成方案", "先看方法库", "我有点急，能快点吗"];
  } else {
    chips = ["今天任务是什么？", "我想换方法", "复盘今天", "看看我的记忆"];
    if (state.logs.length === 0) chips.unshift("我完成了，怎么反馈？");
  }
  box.innerHTML = chips.map((c) => `<button class="chip" data-action="chip" data-text="${escAttr(c)}">${esc(c)}</button>`).join("");
  const input = $("#messageInput");
  if (input) {
    input.placeholder = state.gate.complete
      ? "和教练继续聊，或点上面的快捷问题…"
      : `回答第 ${state.gate.step + 1} 问：${GATE_QUESTIONS[state.gate.step]?.title || ""}`;
  }
}

function scrollChat() {
  const el = $("#chatStream");
  if (!el) return;
  requestAnimationFrame(() => {
    el.scrollTop = el.scrollHeight;
    setTimeout(() => {
      el.scrollTop = el.scrollHeight;
    }, 80);
  });
}

function showTyping() {
  const stream = $("#chatStream");
  if (!stream || $("#typingIndicator")) return;
  const div = document.createElement("div");
  div.id = "typingIndicator";
  div.className = "message";
  div.innerHTML = `<div class="avatar">法</div><div class="msg-wrap"><div class="msg-meta"><strong>小法 · 学习教练</strong><span>正在想</span></div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
  stream.appendChild(div);
  scrollChat();
}

function hideTyping() {
  const el = $("#typingIndicator");
  if (el) el.remove();
}

/* ------------------------------------------------------------------ gate flow */
function looksLikePlanRequest(text) {
  const t = text.trim();
  return (
    /^(直接|快点|别问|跳过|不要问)/.test(t) ||
    /(别问|跳过).*(问题|三问)/.test(t) ||
    /(直接|马上).*(给|出|生成).*(方案|计划|方法)/.test(t)
  );
}

function handleGate(text) {
  const t = text.trim();
  if (t.length < 3) {
    addMessage("agent", "text", "再具体一点。你可以只给我一个场景 + 一个最近的表现，我就能开始判断。");
    renderAll();
    return;
  }
  if (looksLikePlanRequest(t)) {
    const q = GATE_QUESTIONS[state.gate.step];
    addMessage("agent", "text", `我理解你着急。但还差第 ${state.gate.step + 1} 问：**${q.title}**\n\n这不是拖延——没有这个信息，方案只能靠猜。你先回答这一问，我马上继续。`);
    renderAll();
    return;
  }

  state.gate.answers[state.gate.step] = t;
  state.gate.step += 1;

  if (state.gate.step < 3) {
    const next = GATE_QUESTIONS[state.gate.step];
    addMessage("agent", "text", `收到 ✅ 第 ${state.gate.step + 1} 问：**${next.title}**\n\n${next.hint}`);
    renderAll();
    return;
  }

  state.gate.complete = true;
  addMessage("agent", "text", "三问完成 ✅ 现在我做三件事：判断学情 → 匹配方法 → 生成今天能执行的任务卡。\n\n先说明：**方案不是终局，是一个 3 天微试验。**");
  renderAll();
  busy = true;
  showTyping();
  setTimeout(() => {
    generatePlan();
    hideTyping();
    busy = false;
    renderAll();
  }, 750);
}

function generatePlan() {
  if (!state.gate.complete) return;
  const profile = E.buildProfile(state.gate.answers);
  const candidates = E.matchMethods(METHODS, profile);
  const method = candidates[0];
  if (!method) return;
  state.profile = profile;
  state.match = candidates;
  state.methodId = method.id;
  state.diagnosis = E.buildDiagnosis(profile, method);
  state.plan = E.buildTasks(profile, method);
  state.lastSummary = null;
  state.trials = [];
  state.logs = [];
  startTrial(method);

  addMessage("agent", "diagnosis", "", { diagnosis: state.diagnosis });
  addMessage("agent", "method", "", { method, alternatives: candidates.slice(0, 3) });
  addMessage("agent", "plan", "", { plan: state.plan, method, profile, day: 1 });
  addMessage(
    "agent",
    "text",
    "任务卡已经生成。做完之后，点 **「完成打卡，反馈今天」**，告诉我四件事：完成度、难度、自测分、今天最卡的地方。\n\n我会根据你的反馈做今日总结；如果方法不适合，我会**直接给你换法**，并把明天学什么排好。"
  );
  persist();
}

/* ------------------------------------------------------------------ coach flow */
async function sendMessage(text) {
  const t = String(text || "").trim();
  if (!t || busy) return;
  const input = $("#messageInput");
  if (input) {
    input.value = "";
    autoResize(input);
  }
  addMessage("user", "text", t);
  renderChat();
  renderSuggestions();
  persist();

  if (!state.gate.complete) {
    handleGate(t);
    return;
  }

  if (!state.plan) {
    busy = true;
    showTyping();
    await sleep(450);
    generatePlan();
    hideTyping();
    busy = false;
    renderAll();
    return;
  }

  busy = true;
  showTyping();
  await sleep(350);
  try {
    await handleCoach(t);
  } finally {
    hideTyping();
    busy = false;
    renderAll();
  }
}

async function handleCoach(text) {
  const t = text.trim();

  if (/换.*方法|换个方法|不适合|没用|效果不好|想换/.test(t)) {
    manualSwitch("你主动提出换法。先不否定旧方法，我们只控制一个变量：换一个更匹配当前瓶颈的方法。");
    return;
  }

  if (/复盘|总结|今天怎么样|效果如何/.test(t)) {
    showLastSummary();
    return;
  }

  if (/今天.*(任务|学什么)|任务卡|计划|做什么/.test(t)) {
    addMessage("agent", "text", "今天还是这张卡。先把第 2 步做完，再来反馈；不要临时加码。");
    addMessage("agent", "plan", "", { plan: state.plan, method: METHOD_MAP.get(state.methodId), profile: state.profile, day: state.logs.length + 1 });
    return;
  }

  if (/记忆|档案|了解我|记得我/.test(t)) {
    addMessage("agent", "text", "我记得的不是聊天记录，而是能影响下一次决策的变量：你的目标、起点、时间约束、每次打卡的完成率/难度/自测，以及哪种方法对你有效。");
    setView("memory");
    return;
  }

  if (/方法库|有哪些方法|方法卡|换个领域/.test(t)) {
    addMessage("agent", "text", "方法库在左边。你可以按领域筛，也可以直接告诉我目标，我帮你缩小到 3 个候选。");
    setView("library");
    return;
  }

  if (/你好|在吗|hi|hello|嗨/.test(t)) {
    addMessage("agent", "text", `我在 🙌 今天是第 ${state.logs.length + 1} 天。你现在最该做的，是完成「${METHOD_MAP.get(state.methodId)?.name || "今日方法"}」的任务卡；卡住了就告诉我卡在哪一步。`);
    return;
  }

  if (/不想|没时间|太难|焦虑|崩溃|坚持不了|累/.test(t)) {
    addMessage("agent", "text", "先不解决「坚持」，先解决「启动」。把今天任务卡缩成最小版本：只做第 1 步，5 分钟，做完就停。\n\n你不是懒，你可能是任务设计得太大。明天我会把难度再降一档。");
    return;
  }

  if (/怎么|如何|具体|步骤/.test(t)) {
    const m = METHOD_MAP.get(state.methodId);
    if (m) {
      addMessage("agent", "text", `今天这个方法叫「${m.name}」。具体只做三步：\n\n1. ${m.steps[0]}\n2. ${m.steps[1]}\n3. ${m.steps[2]}\n\n不要一次做完整套；先做出一个可检查的产出。`);
      return;
    }
  }

  if (state.llmEnabled) {
    try {
      const reply = await askLLM(t);
      if (reply) {
        addMessage("agent", "text", reply);
        return;
      }
    } catch {
      /* fall through to local */
    }
  }

  const m = METHOD_MAP.get(state.methodId);
  addMessage(
    "agent",
    "text",
    `我在听。先把这句话放进今天的判断里：**${t}**\n\n现在不需要更多建议，只需要一个动作——回到「${m?.name || "今日方法"}」的任务卡，完成最小的一步。完成后打卡，我会用你的反馈决定明天是加难度、降难度，还是换法。`
  );
}

async function askLLM(message) {
  const res = await fetch("/api/coach", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      context: {
        profile: state.profile,
        method: METHOD_MAP.get(state.methodId)?.name,
        plan: state.plan?.tasks?.map((t) => ({ title: t.title, done: t.done })),
        recentLogs: state.logs.slice(-5),
      },
    }),
  });
  if (!res.ok) throw new Error("LLM unavailable");
  const data = await res.json();
  return data.text;
}

/* ------------------------------------------------------------------ tasks / feedback */
function toggleTask(taskId) {
  if (!state.plan) return;
  const task = state.plan.tasks.find((t) => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  persist();
  renderAll();
  scrollChat();
}

function openFeedback() {

  }
